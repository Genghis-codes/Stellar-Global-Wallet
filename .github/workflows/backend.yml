name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # One install at the repo root resolves the backend's workspace
        # dependencies (@globe-wallet/sdk, @stellar-global-wallet/types).
        run: npm ci

      - name: Build workspace packages the backend imports
        # The SDK and the contract bindings are consumed from their dist/
        # output, so build them before type-checking or testing the backend.
        run: |
          npm run build --workspace packages/bindings/globe-wallet
          npm run build --workspace packages/sdk

      - name: Type-check
        run: npm run type-check --workspace backend

      - name: Check i18n catalogue completeness
        run: npm run i18n:check --workspace=packages/i18n

      - name: Test
        # Route tests assert supertest responses against backend/openapi.yaml
        # via jest-openapi (see backend/tests/env.setup.ts), so this step
        # fails CI when a route and the OpenAPI spec drift apart.
        run: npm test --workspace backend
