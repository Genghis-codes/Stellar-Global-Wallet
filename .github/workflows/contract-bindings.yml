name: Contract Bindings

on:
  push:
    branches: [main]
    paths:
      - 'contract/contracts/globe-wallet/**'
      - 'contract/contracts/token-wrapper/**'
      - 'contract/scripts/bindings.sh'
      - 'packages/bindings/**'
      - '.github/workflows/contract-bindings.yml'
  pull_request:
    paths:
      - 'contract/contracts/globe-wallet/**'
      - 'contract/contracts/token-wrapper/**'
      - 'contract/scripts/bindings.sh'
      - '.github/workflows/contract-bindings.yml'

jobs:
  bindings:
    name: Generate & verify TypeScript bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Stellar CLI >= 25 builds for wasm32v1-none.
          targets: wasm32v1-none, wasm32-unknown-unknown

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version 27.0.0

      - name: Generate bindings
        run: bash contract/scripts/bindings.sh

      - name: Fail if generated bindings are stale
        run: |
          if [[ -n "$(git status --porcelain packages/bindings/globe-wallet packages/bindings/token-wrapper)" ]]; then
            echo "error: generated bindings are out of date. Run contract/scripts/bindings.sh and commit the result." >&2
            git --no-pager diff -- packages/bindings/globe-wallet packages/bindings/token-wrapper
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check SDK against bindings
        run: |
          npm run build --workspace packages/bindings/globe-wallet
          npm run type-check --workspace packages/sdk
