name: E2E Local Quickstart (Contract + Backend + SDK)

# Hermetic end-to-end suite (#232): boots a local stellar/quickstart node
# (Horizon + Soroban RPC + local Friendbot), Postgres, and Redis, deploys
# globe-wallet & token-wrapper via contract/scripts/deploy-local.sh, and runs
# full send, spend-limit, and social-recovery scenarios across the deployed
# contracts, Express backend, and @globe-wallet/sdk. Zero dependency on public
# testnet.

on:
  pull_request:
    paths:
      - "contract/**"
      - "backend/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-local.yml"
  push:
    branches: [main]
    paths:
      - "contract/**"
      - "backend/**"
      - "packages/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-local.yml"
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-local:
    name: Hermetic E2E (stellar/quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain (wasm32v1-none)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/stellar
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contract/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('contract/Cargo.toml', 'contract/contracts/*/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Install Stellar CLI (if not cached)
        run: |
          if ! command -v stellar >/dev/null 2>&1; then
            cargo install --locked stellar-cli --version 27.0.0
          fi
          stellar --version

      - name: Start local Stellar quickstart, Postgres, and Redis
        run: |
          docker compose --profile local up -d postgres redis stellar
          docker compose --profile local ps

      - name: Wait for Postgres and Redis readiness
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U user -d globewallet >/dev/null 2>&1 \
              && docker compose exec -T redis redis-cli ping | grep -q PONG; then
              echo "Postgres and Redis are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Postgres/Redis failed to become ready." >&2
          exit 1

      - name: Deploy contracts via deploy-local.sh
        env:
          SOROBAN_CLI: stellar
        run: |
          chmod +x contract/scripts/deploy-local.sh
          ./contract/scripts/deploy-local.sh
          cat contract/deployments/local.json

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Build workspace packages (bindings + SDK)
        run: npm run build:packages

      - name: Run local quickstart E2E suite (contract + backend + SDK)
        env:
          E2E_LOCAL: "1"
          E2E_LOCAL_HORIZON_URL: "http://localhost:8000"
          E2E_LOCAL_RPC_URL: "http://localhost:8000/soroban/rpc"
          E2E_LOCAL_FRIENDBOT_URL: "http://localhost:8000/friendbot"
          E2E_LOCAL_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
          E2E_ARTIFACT_DIR: "${{ github.workspace }}/backend/artifacts/e2e"
          DATABASE_URL: "postgresql://user:password@localhost:5432/globewallet"
          REDIS_URL: "redis://localhost:6379"
        run: npm run test:e2e:local --workspace backend -- --verbose

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p backend/artifacts/e2e
          docker compose --profile local logs --tail=300 stellar > backend/artifacts/e2e/stellar-quickstart.log 2>&1 || true
          docker compose --profile local logs --tail=200 postgres > backend/artifacts/e2e/postgres.log 2>&1 || true
          docker compose --profile local logs --tail=200 redis > backend/artifacts/e2e/redis.log 2>&1 || true
          cp -f contract/deployments/local.json backend/artifacts/e2e/local-deployment.json 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-local-failure-artifacts
          path: backend/artifacts/e2e/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down local containers
        if: always()
        run: docker compose --profile local down -v --remove-orphans || true
