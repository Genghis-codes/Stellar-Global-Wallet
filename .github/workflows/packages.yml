name: Packages

on:
  push:
    branches: [main]
    tags: ['sdk-*', 'sdk-kotlin-*', 'sdk-swift-*']
  pull_request:
    paths:
      - 'packages/**'
      - 'backend/openapi.yaml'
      - '.github/workflows/packages.yml'

jobs:
  sdk-typescript:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: packages/sdk }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      # packages/sdk is an npm workspace: the only lockfile is at the repo
      # root, and the SDK type-checks against the contract bindings' dist/.
      - run: npm ci
        working-directory: .
      - run: npm run build --workspace packages/bindings/globe-wallet
        working-directory: .
      - run: npm run type-check
      - run: npm test

  sdk-kotlin:
    name: SDK (Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: packages/sdk-kotlin }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate client from OpenAPI
        run: ./gradlew openApiGenerate
      - name: Conformance tests
        run: ./gradlew test

  sdk-swift:
    name: SDK (Swift)
    runs-on: macos-14
    defaults:
      run: { working-directory: packages/sdk-swift }
    steps:
      - uses: actions/checkout@v7
      - name: Generate client from OpenAPI
        run: swift package plugin --allow-writing-to-package-directory openapi-generate
      - name: Conformance tests
        run: swift test

  publish:
    name: Publish SDKs
    if: startsWith(github.ref, 'refs/tags/sdk-')
    needs: [sdk-typescript, sdk-kotlin, sdk-swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Publish TypeScript SDK
        working-directory: packages/sdk
        run: |
          npm ci --prefix ../..
          npm run build --prefix ../bindings/globe-wallet
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish Kotlin SDK
        working-directory: packages/sdk-kotlin
        run: ./gradlew publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Publish Swift SDK
        working-directory: packages/sdk-swift
        run: swift package archive-source
