name: Packages CI

on:
  push:
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/packages.yml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/packages.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      # The backend is also a workspace (it has its own Backend CI), so name
      # the publishable packages explicitly, in dependency order: the SDK
      # imports the generated bindings' dist/ output.
      - name: Build
        run: |
          npm run build --workspace packages/bindings/globe-wallet
          npm run build --workspace packages/sdk

      - name: Type-check
        run: |
          npm run type-check --workspace packages/types --if-present
          npm run type-check --workspace packages/fixtures --if-present
          npm run type-check --workspace packages/sdk

      - name: Test
        run: npm test --workspace packages/sdk

      - name: Check i18n catalogue completeness
        run: npm run i18n:check --workspace=packages/i18n
