# Verifies npm registry signatures for the PR's dependencies. Installs
# packages (with scripts disabled), so it runs on `pull_request`, never
# with elevated permissions. Split out of pr-security.yml, which only uses
# `pull_request_target`.
name: PR Package Signatures

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-package-signatures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package-signatures:
    name: Package signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install without running install scripts
        run: npm ci --ignore-scripts

      # Verifies registry signatures and provenance for installed packages.
      - name: Verify package signatures
        run: npm audit signatures
