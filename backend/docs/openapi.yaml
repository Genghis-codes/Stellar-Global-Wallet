# OpenAPI 3.1 paths for the send-flow and statement endpoints (#62–#65).
#
# The full spec for every /api/v1 route is tracked in issue #15; this file
# covers the routes added/changed by #62, #63, #64 and #65 and reuses the
# shared error envelope + examples from ./openapi-errors.yaml so it can be
# merged into that spec unchanged.
#
# Amount convention (#25): every monetary amount in a response is a JSON
# string, never a number. Stellar amounts use decimal strings with up to 7
# decimal places (see `Amount`). Soroban i128 values are returned in base
# units (stroops) as `{ value: "<integer string>", decimals: 7 }` (see
# `BaseUnitAmount`). Prices are the exception: they may legitimately need
# more than 7 decimals and are documented separately (see `Price`).
openapi: 3.1.0
info:
  title: Stellar Global Wallet API
  version: 1.0.0
  description: |
    Backend API for the Stellar Global Wallet.

    ## Error handling

    All errors use a shared envelope with a stable `code` field. Clients should
    branch on `code`, never on the human-readable `message`. The full catalogue
    of codes — with HTTP status, retryability, when each occurs, and suggested
    user-facing copy — lives in
    [`docs/error-codes.md`](../docs/error-codes.md).

    Regenerate the catalogue with `npm run docs:errors` after changing any code
    in `src/errors/`, `src/services/stellarErrors.ts`,
    `src/services/sorobanErrors.ts`, or `src/services/globeWalletErrors.ts`.

    ### Error envelope

    ```json
    {
      "error": {
        "code": "REFRESH_TOKEN_INVALID",
        "message": "Refresh token is invalid or expired",
        "requestId": "b1e2c3d4-..."
      }
    }
    ```

    ### Retryable codes

    Codes marked retryable in the catalogue (for example `LOGIN_RATE_LIMITED`
    and Horizon/Soroban transient failures) may be retried with backoff. Codes
    such as `REFRESH_TOKEN_INVALID` and `ROUTE_NOT_FOUND` are not retryable and
    require the client to re-authenticate or correct the request.

    ## Encrypted key backup (#274)

    The backup endpoints store **only ciphertext**. The wallet secret is
    encrypted on the client before upload; the server never sees the plaintext
    secret, the wrapping key, or the passphrase. See
    [`docs/key-backup.md`](./key-backup.md) for the client-side encryption spec,
    recovery flow and threat model.
servers:
  - url: http://localhost:4000
    description: Local development
paths:
  /api/v1/backups:
    post:
      summary: Upload an encrypted key backup blob
      description: >-
        Stores an opaque, client-encrypted backup blob for the authenticated
        user. The server treats `ciphertext` as opaque bytes and never attempts
        to decrypt it. Uploading replaces any existing blob for the user
        (last-write-wins). Rate limited per user.
      operationId: uploadKeyBackup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyBackupUpload"
      responses:
        "201":
          description: Backup stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyBackupMetadata"
        "400":
          description: >-
            Invalid input (e.g. `BACKUP_INVALID_CIPHERTEXT`,
            `BACKUP_INVALID_KDF_PARAMS`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Ciphertext exceeds the maximum allowed size (`BACKUP_TOO_LARGE`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`BACKUP_RATE_LIMITED`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Fetch the authenticated user's encrypted backup blob
      description: >-
        Returns the stored ciphertext blob and its non-secret metadata. The
        client derives the wrapping key locally and decrypts. Rate limited per
        user.
      operationId: getKeyBackup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Backup found.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyBackupBlob"
        "401":
          description: Missing or invalid bearer token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No backup stored for this user (`BACKUP_NOT_FOUND`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`BACKUP_RATE_LIMITED`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete the authenticated user's encrypted backup blob
      operationId: deleteKeyBackup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: Backup deleted (idempotent).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "401":
          description: Missing or invalid bearer token.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (`BACKUP_RATE_LIMITED`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional client-supplied correlation ID. Accepted only when it matches
        `^[A-Za-z0-9-]{8,64}$`; otherwise the server generates a UUID. The
        resolved value is always echoed back in the `X-Request-Id` response
        header and included in error envelopes as `requestId`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
        example: "3f1c9a2e-7b4d-4c8a-9e6f-1a2b3c4d5e6f"
  headers:
    X-Request-Id:
      description: >-
        Correlation ID for this request. Present on every response (success
        and error). Use it to find the matching server log line.
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
        example: "3f1c9a2e-7b4d-4c8a-9e6f-1a2b3c4d5e6f"
  responses:
    Error:
      description: Shared error envelope
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      $ref: "./openapi-errors.yaml#/components/schemas/ErrorResponse"
    KeyBackupKdf:
      type: object
      description: >-
        Non-secret KDF parameters the client used to derive the wrapping key.
        Stored alongside the ciphertext so recovery can re-derive the key. The
        salt is public; the passphrase and derived key are never sent.
      required: [algorithm, salt, memoryKiB, iterations, parallelism]
      properties:
        algorithm:
          type: string
          enum: [argon2id, passkey-prf]
        salt:
          type: string
          description: Base64-encoded random salt (>= 16 bytes).
          example: "3q2+7w=="
        memoryKiB:
          type: integer
          minimum: 19456
          description: Argon2id memory cost in KiB (OWASP minimum 19456).
          example: 65536
        iterations:
          type: integer
          minimum: 2
          example: 3
        parallelism:
          type: integer
          minimum: 1
          example: 1
    KeyBackupUpload:
      type: object
      required: [version, cipher, ciphertext, nonce, kdf]
      properties:
        version:
          type: integer
          enum: [1]
          description: Backup format version.
        cipher:
          type: string
          enum: [xchacha20poly1305]
          description: AEAD used to wrap the secret on the client.
        ciphertext:
          type: string
          description: >-
            Base64-encoded AEAD ciphertext (includes the auth tag). Opaque to
            the server. Maximum 8 KiB decoded.
          example: "9xQ7..."
        nonce:
          type: string
          description: Base64-encoded 24-byte XChaCha20 nonce.
          example: "AAAAAAAAAAAAAAAAAAAAAAAA"
        kdf:
          $ref: "#/components/schemas/KeyBackupKdf"
    KeyBackupMetadata:
      type: object
      required: [version, cipher, kdf, updatedAt]
      properties:
        version:
          type: integer
          enum: [1]
        cipher:
          type: string
          enum: [xchacha20poly1305]
        kdf:
          $ref: "#/components/schemas/KeyBackupKdf"
        updatedAt:
          type: string
          format: date-time
    KeyBackupBlob:
      allOf:
        - $ref: "#/components/schemas/KeyBackupMetadata"
        - type: object
          required: [ciphertext, nonce]
          properties:
            ciphertext:
              type: string
              description: Base64-encoded AEAD ciphertext. Opaque to the server.
            nonce:
              type: string
              description: Base64-encoded 24-byte XChaCha20 nonce.
    Amount:
      type: string
      pattern: '^\d+(\.\d{1,7})?$'
      description: >-
        Positive decimal string, at most 7 decimal places. Never a JSON
        number. Use this for every Stellar amount (balances, limits, fees,
        spendable, send amounts).
      example: "12.5"
    BaseUnitAmount:
      type: object
      description: >-
        A Soroban i128 value expressed in base units (stroops). `value` is an
        integer string (never a JSON number) and `decimals` states how many
        decimal places to shift by to get the human amount. For Stellar
        assets `decimals` is 7.
      required: [value, decimals]
      properties:
        value:
          type: string
          pattern: '^-?\d+$'
          description: Integer amount in base units, as a string.
          example: "10000000"
        decimals:
          type: integer
          minimum: 0
          description: Number of decimal places the base units represent.
          example: 7
    Price:
      type: string
      description: >-
        Price as a decimal string. Unlike `Amount`, prices may legitimately
        need more than 7 decimal places, so no fixed precision is enforced
        here; consumers must parse as a decimal, never a float.
      example: "0.123456789"
    AccountId:
      type: string
      pattern: "^G[A-Z2-7]{55}$"
      description: Checksum-validated Stellar account ID (G...).
      example: "GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
    Asset:
      type: string
      description: '"XLM" or "CODE:ISSUER". Defaults to XLM when omitted.'
      example: "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
    SendOperationType:
      type: string
      enum: [payment, createAccount]
      description: >-
        Operation the build path uses (#65). `createAccount` is chosen
        automatically when the destination does not exist, the asset is XLM
        and amount >= 1 XLM.
    SendPrecheckWarning:
      type: object
      required: [code, message, blocking]
      properties:
        code:
          type: string
          enum:
            - DESTINATION_IS_SOURCE
            - SOURCE_NOT_FUNDED
            - DESTINATION_NOT_FUNDED
            - DESTINATION_WILL_BE_CREATED
            - NO_TRUSTLINE
            - TRUSTLINE_NOT_AUTHORIZED
            - MEMO_REQUIRED
            - AMOUNT_EXCEEDS_SPENDABLE
        message:
          type: string
        blocking:
          type: boolean
          description: True when submitting as-is would fail on-chain or risk losing funds.
    SendPrecheckResponse:
      type: object
      description: Shared error envelope returned by every endpoint on failure.
      required:
        - error
      properties:
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SendPrecheckWarning" }
        blocking:
          type: boolean
          description: True if any warning is blocking — do not offer "Sign".
        operationType:
          $ref: "#/components/schemas/SendOperationType"
        spendable:
          $ref: "#/components/schemas/Amount"
    ResolvedAddress:
      type: object
      required: [type, accountId]
      properties:
        type:
          type: string
          enum: [account, muxed, federation]
        accountId:
          $ref: "#/components/schemas/AccountId"
        memo:
          type: string
          description: Memo returned by the federation server (federation only). Attach it to the payment.
        memoType:
          type: string
          enum: [text, id, hash]
        muxedId:
          type: string
          description: Muxed sub-account ID as a decimal string (muxed only).
        muxedAddress:
          type: string
          description: The original M... address (muxed only).
    FeeEstimate:
      type: object
      required: [stroops, xlm]
      description: >-
        A single fee tier. `stroops` is the per-operation fee in stroops
        (1 XLM = 10,000,000 stroops) as a decimal string; `xlm` is the same
        value formatted as an XLM decimal string. Both are strings so no
        precision is lost in JSON.
      properties:
        stroops:
          type: string
          pattern: '^\d+$'
          example: "100"
        xlm:
          type: string
          pattern: '^\d+(\.\d{1,7})?$'
          example: "0.0000100"
    NetworkFeesResponse:
      type: object
      required: [low, normal, high, ledgerCapacityUsage, source]
      properties:
        low:
          $ref: "#/components/schemas/FeeEstimate"
        normal:
          $ref: "#/components/schemas/FeeEstimate"
        high:
          $ref: "#/components/schemas/FeeEstimate"
        ledgerCapacityUsage:
          type: string
          description: >-
            Fraction (0–1) of the latest ledger's capacity in use, as a
