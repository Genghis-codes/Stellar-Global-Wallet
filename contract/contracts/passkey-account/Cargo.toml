[package]
name = "passkey-account"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Test-only: produces real P-256 ECDSA signatures for WebAuthn test vectors.
# Dev-only and never linked into the contract WASM. 0.14 is newer than the
# 0.13 soroban-env-host uses internally for secp256r1_verify, so the test
# graph carries both (deny.toml only warns on multiple versions).
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "arithmetic"] }

[features]
testutils = ["soroban-sdk/testutils"]
